name: Compilar CVs

on:
  push:
    branches: [main]
    paths:
      - "**.tex"
      - "**.bib"
      - ".github/workflows/build-cv.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Compilar los .tex a PDF
        uses: xu-cheng/texlive-action@v3
        with:
          run: |
            for lang in es en; do
              echo "::group::Compilando cv-$lang.tex"
              latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode cv-$lang.tex
              latexmk -c cv-$lang.tex
              echo "::endgroup::"
            done

      - name: Renombrar PDFs y generar previsualizaciones
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          rm -rf preview && mkdir -p preview

          mv cv-es.pdf Carlos-Lafuente-Sanz-CV-ES.pdf
          mv cv-en.pdf Carlos-Lafuente-Sanz-CV-EN.pdf

          pdftoppm -png -r 110 Carlos-Lafuente-Sanz-CV-ES.pdf preview/cv-es
          pdftoppm -png -r 110 Carlos-Lafuente-Sanz-CV-EN.pdf preview/cv-en
          ls -la preview

      - name: Insertar previsualización en los README
        run: |
          python3 - <<'PY'
          import glob, re

          targets = [
              ("README.md",    "es", "CV en español - página"),
              ("README.en.md", "en", "CV in English - page"),
          ]

          for readme, lang, alt in targets:
              try:
                  txt = open(readme, encoding="utf-8").read()
              except FileNotFoundError:
                  continue
              imgs = sorted(glob.glob(f"preview/cv-{lang}-*.png"))
              block = "\n".join(
                  f'<img src="{p}" width="100%" alt="{alt} {i}">'
                  for i, p in enumerate(imgs, 1)
              )
              new = re.sub(
                  r"(<!-- CV-PREVIEW:START -->).*?(<!-- CV-PREVIEW:END -->)",
                  lambda m: f"{m.group(1)}\n\n{block}\n\n{m.group(2)}",
                  txt, flags=re.S,
              )
              if new != txt:
                  open(readme, "w", encoding="utf-8").write(new)
                  print(f"Actualizado {readme} ({len(imgs)} páginas)")
          PY

      - name: Publicar PDFs y previsualizaciones
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.pdf' preview README.md README.en.md
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "CI: recompilar CVs [skip ci]"
            git push
          fi
